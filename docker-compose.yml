# Local development stack. NOT a production deployment (see docs/DEPLOYMENT_GUIDE.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: finscore
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finscore -d finscore"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      ENV: local
      DATABASE_URL: postgresql+asyncpg://finscore:${POSTGRES_PASSWORD}@db:5432/finscore
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["127.0.0.1:8000:8000"]

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:

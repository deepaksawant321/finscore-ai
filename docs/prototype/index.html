<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinScore AI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: persistent left rail on desktop, bottom tabs on phone; answer-first home, conversation as primary input. */
:root{
  --bg:#F3F7F8; --surface:#FFFFFF; --surface2:#ECF2F3; --ink:#0B1B2B; --muted:#58697A; --line:#DAE4E7;
  --brand:#0FB5A6; --brand-strong:#0A8579; --on-brand:#03201C; --brand-soft:#DDF5F2;
  --ai:#4F46E5; --ai-soft:#E9E8FD; --pos:#0B8F5A; --pos-soft:#DCF3E7;
  --warn:#9A5B00; --warn-fill:#F5A524; --warn-soft:#FDEFD3; --neg:#C5292F; --neg-fill:#E5484D; --neg-soft:#FCE3E3;
  --shadow:0 1px 2px rgb(11 27 43/.06),0 8px 24px rgb(11 27 43/.06);
  --font:'Inter',system-ui,sans-serif; --font-num:'Space Grotesk','Inter',system-ui,sans-serif;
  --r-md:8px; --r-lg:12px; --r-xl:20px; --rail:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08121C; --surface:#0F1D2B; --surface2:#152738; --ink:#E8F0F3; --muted:#92A6B5; --line:#1F3345;
  --brand:#2DD4C4; --brand-strong:#2DD4C4; --on-brand:#03201C; --brand-soft:#0E3A3A;
  --ai:#9A96FF; --ai-soft:#25245A; --pos:#3DDC97; --pos-soft:#0F3326;
  --warn:#F5B648; --warn-fill:#F5A524; --warn-soft:#3A2B0C; --neg:#FF7A7F; --neg-fill:#E5484D; --neg-soft:#40181B;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121C; --surface:#0F1D2B; --surface2:#152738; --ink:#E8F0F3; --muted:#92A6B5; --line:#1F3345;
  --brand:#2DD4C4; --brand-strong:#2DD4C4; --on-brand:#03201C; --brand-soft:#0E3A3A;
  --ai:#9A96FF; --ai-soft:#25245A; --pos:#3DDC97; --pos-soft:#0F3326;
  --warn:#F5B648; --warn-fill:#F5A524; --warn-soft:#3A2B0C; --neg:#FF7A7F; --neg-fill:#E5484D; --neg-soft:#40181B;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
h1{font:600 28px/1.2 var(--font-num);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 17px/1.3 var(--font);} h3{font:600 15px/1.3 var(--font)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.eyebrow{font:600 11px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:700 18px var(--font-num)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--ai));display:grid;place-items:center;color:#fff}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);color:var(--muted);text-decoration:none;font-weight:500;min-height:44px}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.nav-sep{margin:12px 12px 4px}
.rail-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface2)}
.main{min-width:0;display:flex;flex-direction:column}
.demo-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 16px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:500;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted)}
.search input{border:0;background:none;outline:0;width:100%}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icon-btn:hover{border-color:var(--brand)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--neg-fill);border:2px solid var(--surface)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-weight:700}
.view{padding:8px 28px 56px;max-width:1180px;width:100%;margin:0 auto;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 20px}
.page-head p{margin-top:6px;max-width:60ch}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border-radius:var(--r-lg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g-home{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-sim{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}.card,.item,section,aside{min-width:0}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);transition:transform .15s,background .15s}
.btn:hover{background:var(--surface2)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;min-height:32px}
button.chip:hover{border-color:var(--brand);background:var(--brand-soft)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-pos{background:var(--pos-soft);color:var(--pos)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-neg{background:var(--neg-soft);color:var(--neg)} .b-ai{background:var(--ai-soft);color:var(--ai)} .b-neutral{background:var(--surface2);color:var(--muted)}
.b-brand{background:var(--brand-soft);color:var(--brand-strong)}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface2);border-radius:999px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;min-height:36px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.tip{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700;border:0;cursor:help}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:230px;padding:9px 11px;border-radius:10px;background:var(--ink);color:var(--bg);font:500 12px/1.4 var(--font);z-index:20;text-align:left}

/* score hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}.trio>div{padding:12px}
.ring{position:relative;width:260px;height:236px}
.ring svg{display:block;width:100%;height:100%;overflow:visible}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:22px}
.ring-c .big{font:700 62px/1 var(--font-num);letter-spacing:-.03em}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hero .trio{grid-template-columns:1fr;gap:8px}.hero .trio>div{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;padding:10px 14px}.hero .trio .v{margin:0;font-size:20px}.hero .trio p{margin:0!important}.hero .trio .bar{margin:0!important;grid-column:auto;width:70px}.trio .eyebrow{display:flex;align-items:center;gap:4px;white-space:nowrap}.trio .v{white-space:nowrap}
.trio>div{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface2)}
.trio .v{font:600 22px/1.2 var(--font-num);margin-top:6px}
.ladder{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.ladder i{height:8px;border-radius:4px;background:var(--surface2)} .ladder i.on{background:var(--brand)} .ladder i.cur{background:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.ladder-l{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:11px;color:var(--muted);margin-top:6px;text-align:center}.ladder-l span{white-space:nowrap;overflow:visible}.ladder-l span:first-child{text-align:left}.ladder-l span:last-child{text-align:right}
.ladder-l .cur{color:var(--ai);font-weight:700}

/* lists */
.item{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.i-brand{background:var(--brand-soft);color:var(--brand-strong)} .i-ai{background:var(--ai-soft);color:var(--ai)} .i-warn{background:var(--warn-soft);color:var(--warn)} .i-neg{background:var(--neg-soft);color:var(--neg)} .i-pos{background:var(--pos-soft);color:var(--pos)}
.vital{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.led{width:10px;height:10px;border-radius:50%;flex:none}
.led.g{background:var(--pos)} .led.a{background:var(--warn-fill)} .led.r{background:var(--neg-fill)}

/* waterfall */
.wf-row{display:grid;grid-template-columns:150px minmax(0,1fr) 58px;gap:12px;align-items:center;padding:9px 8px;border-radius:var(--r-md);border:0;background:none;width:100%;text-align:left}
.wf-row:hover,.wf-row[aria-pressed="true"]{background:var(--surface2)}
.wf-track{position:relative;height:22px}
.wf-track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.wf-track i{position:absolute;top:3px;height:16px;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.wf-pos i{left:50%;background:var(--brand)} .wf-neg i{right:50%;background:var(--neg-fill)}

/* chat */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;height:calc(100vh - 210px);min-height:520px}
.chat-main{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:84%;padding:12px 16px;border-radius:18px;animation:in .25s ease-out}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.msg .trace{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.composer{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-height:46px;border-radius:999px;border:1px solid var(--line);padding:0 18px;background:var(--bg);outline:0}
.composer input:focus{border-color:var(--ai)}
.fact{display:flex;gap:10px;padding:10px;border-radius:var(--r-md);border:1px dashed var(--line);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.fact.ok{border-style:solid;background:var(--brand-soft)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.typing i{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}

/* simulator */
.slider{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.slider:last-child{border:0}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.delta{font:700 40px/1 var(--font-num)}

/* timeline */
.tl{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:18px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.tl>div.done::before{background:var(--brand)} .tl>div.risk::before{border-color:var(--warn-fill)}

/* dna */
.trait .meter{display:flex;gap:3px;margin-top:8px}
.trait .meter i{flex:1;height:6px;border-radius:3px;background:var(--surface2)} .trait .meter i.on{background:var(--ai)}
.persona{background:linear-gradient(140deg,#0B1B2B,#16335A 60%,#2A2A8F);color:#fff;border:0;position:relative;overflow:hidden}
.persona .eyebrow{color:#9FB6C9}
.persona::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgb(15 181 166/.45),transparent 65%)}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border:0}
.scroll-x{overflow-x:auto;position:relative}
.edit{border:1px solid var(--brand);border-radius:8px;padding:6px 10px;background:var(--bg);width:140px;font-variant-numeric:tabular-nums}

/* welcome */
.welcome{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.w-left{padding:48px max(24px,5vw);display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:680px}
.w-left h1{font-size:clamp(32px,4.4vw,52px);line-height:1.08}
.ask{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--shadow)}
.ask input{flex:1;border:0;outline:0;background:none;min-width:0}
.w-right{background:linear-gradient(160deg,#0B1B2B,#123A5E 55%,#1B2A7A);display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}
.w-right::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;left:-120px;bottom:-200px;background:radial-gradient(circle,rgb(15 181 166/.35),transparent 65%)}
.phone{width:min(300px,100%);background:var(--surface);color:var(--ink);border-radius:32px;padding:22px 20px;box-shadow:0 30px 80px rgb(0 0 0/.45);position:relative;display:flex;flex-direction:column;gap:14px;align-items:center}
.trust{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.trust span{display:inline-flex;gap:6px;align-items:center}

/* mobile tabs */
.tabbar{display:none}
.sheet{position:fixed;inset:0;z-index:40;background:rgb(0 0 0/.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet>div{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1100px){.g-sim{grid-template-columns:1fr}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-home{grid-template-columns:1fr}.chat{grid-template-columns:1fr;height:auto}.chat-main{height:70vh}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)} .rail{display:none}
  .top{padding:12px 16px} .search{display:none}
  .view{padding:4px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
  .g-3,.g-2{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;padding:6px 0;min-height:48px;border-radius:12px}
  .tabbar [aria-current="page"]{color:var(--brand-strong)}
  .tabbar [aria-current="page"] svg{background:var(--brand-soft);border-radius:10px;padding:3px;width:30px;height:24px;box-sizing:content-box}
  h1{font-size:24px}
  .hero{grid-template-columns:1fr;justify-items:center;gap:18px} .hero>div:last-child{width:100%}
  .welcome{grid-template-columns:1fr} .w-right{min-height:440px;order:-1} .w-left{padding:28px 16px 40px}
  .wf-row{grid-template-columns:104px minmax(0,1fr) 46px;gap:8px}
  .msg{max-width:94%}
}
@media (max-width:520px){.g-4{grid-template-columns:1fr}.trio .v{font-size:18px}.ring{width:230px;height:210px}.ring-c .big{font-size:54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2 fintech skin: aurora ground, glass rail, dark glowing score card, gradient actions ===== */
:root{--mesh1:rgb(15 181 166/.20);--mesh2:rgb(79 70 229/.16);--mesh3:rgb(245 165 36/.10);--glass:rgb(255 255 255/.72);--glass-line:rgb(255 255 255/.7);--shadow:0 1px 1px rgb(11 27 43/.04),0 4px 10px rgb(11 27 43/.04),0 18px 40px rgb(11 27 43/.07);--rail:252px;--r-xl:24px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mesh1:rgb(45 212 196/.16);--mesh2:rgb(110 100 255/.20);--mesh3:rgb(245 165 36/.05);--glass:rgb(15 29 43/.68);--glass-line:rgb(255 255 255/.08)}}
:root[data-theme="dark"]{--mesh1:rgb(45 212 196/.16);--mesh2:rgb(110 100 255/.20);--mesh3:rgb(245 165 36/.05);--glass:rgb(15 29 43/.68);--glass-line:rgb(255 255 255/.08)}
body{background-image:radial-gradient(900px 520px at 8% -8%,var(--mesh1),transparent 60%),radial-gradient(800px 560px at 100% 0%,var(--mesh2),transparent 60%),radial-gradient(700px 500px at 60% 110%,var(--mesh3),transparent 60%);background-attachment:fixed}

function ringSVG(score, animate=true){
  const cx=130, cy=124, r=104, a0=135, sweep=270;
  const pt = (deg,rad=r) => [cx+rad*Math.cos(deg*Math.PI/180), cy+rad*Math.sin(deg*Math.PI/180)];
  const arc = (d0,d1,rad=r) => { const [x0,y0]=pt(d0,rad),[x1,y1]=pt(d1,rad); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${rad} ${rad} 0 ${d1-d0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  const frac = (score-300)/600, end = a0+sweep*frac;
  const segs = Array.from({length:8},(_,i)=>{const s=a0+sweep*i/8+1.2,e=a0+sweep*(i+1)/8-1.2; return `<path d="${arc(s,e)}" stroke="var(--surface2)" stroke-width="14" stroke-linecap="butt" fill="none"/>`}).join('');
  const len = Math.PI*r*2*sweep/360, fillLen = len*frac;
  const [kx,ky]=pt(end);
  return `<svg viewBox="0 0 260 236" role="img" aria-label="FinScore ${score} out of 900, stage ${STAGES[stageOf(score)]}">
    <defs><linearGradient id="rg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--ai)"/></linearGradient></defs>
    ${segs}
    <path id="rfill" d="${arc(a0,a0+sweep)}" stroke="url(#rg)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${animate?len:len-fillLen}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)" data-to="${len-fillLen}"/>
    <circle cx="${kx}" cy="${ky}" r="9" fill="var(--surface)" stroke="var(--ai)" stroke-width="4"/>
    <text x="${pt(a0)[0]-4}" y="${pt(a0)[1]+22}" font-size="11" fill="var(--muted)" text-anchor="middle" class="num">300</text>
    <text x="${pt(a0+sweep)[0]+4}" y="${pt(a0+sweep)[1]+22}" font-size="11" fill="var(--muted)" text-anchor="middle" class="num">900</text></svg>`;
}
const STILL=new URLSearchParams(location.search).has('still');
function countUp(el,to,ms=1000){
  if(STILL||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;return;}
  const t0=performance.now(); const f=t=>{const p=clamp((t-t0)/ms,0,1),e=1-Math.pow(1-p,3); el.textContent=Math.round(300+(to-300)*e); if(p<1)requestAnimationFrame(f)}; requestAnimationFrame(f);
}
function animateRing(root){ const f=$('#rfill',root); if(f) requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.strokeDashoffset=f.dataset.to)); const c=$('.big',root); if(c) countUp(c,+c.dataset.v); }
function sparkline(vals,w=300,h=70,color='var(--brand)'){
  const mn=Math.min(...vals)-8,mx=Math.max(...vals)+8; const x=i=>i*(w-12)/(vals.length-1)+6, y=v=>h-6-(v-mn)/(mx-mn)*(h-12);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Score trend, last 12 months, from ${vals[0]} to ${vals.at(-1)}">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${x(vals.length-1)} ${h} L${x(0)} ${h} Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/></svg>`;
}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function reply(t){ const s=t.toLowerCase();

  if(/rent|saved|lakh|₹|earn|salary/.test(s)) return {t:`Thanks, I have noted that. Please confirm the details on the right before I save them to your Financial Memory. Do you pay any EMIs?`,facts:[{k:'Monthly rent',v:'₹32,000'},{k:'Savings',v:'₹2,00,000'}],q:['Yes, one home loan','No EMIs']};
  if(/problem|save|loan|retire|never/.test(s)) return {t:`That is a very common starting point. To give you a real answer I need three things: your monthly take-home, your fixed costs and what you have saved. You can type them or connect your bank. What is your approximate monthly take-home income?`,facts:[{k:'Main concern',v:t.length>40?t.slice(0,40)+'…':t}],q:['₹1.4 lakh','Connect my bank','Skip for now']};
  return {t:`I can help with that. To keep the answer grounded in your numbers, I will check your profile first. Meanwhile, try one of these.`,trace:['Memory lookup'],q:['Why did my score go up?','What should I fix first?']};
}

const SIM={sip:15000,em:2.5,pre:0,ret:58};
function simCalc(){
  const n=(SIM.ret-USER.age)*12, P0=8.4e5;
  const fv=r=>{const m=Math.pow(1+r,1/12)-1; return P0*Math.pow(1+m,n)+SIM.sip*((Math.pow(1+m,n)-1)/m);};
  const lo=fv(.07),mid=fv(.10),hi=fv(.125), target=4.5e7*1;
  const inflFactor=Math.pow(1.06,(58-USER.age))/Math.pow(1.06,(58-USER.age));
  const prob=Math.round(clamp(100/(1+Math.exp(-(mid/target-.508)*5.2)),4,97));
  const delta=Math.round(clamp((SIM.sip-15000)/1000*.9+(SIM.em-2.5)*4.2+SIM.pre/1000*.7-(SIM.ret<58?(58-SIM.ret)*1.2:0),-30,60));
  const sp=Math.round(8+Math.abs(delta)*.25);
  return {n,lo,mid,hi,target,prob,delta,sp,pts:SCORE+delta};
}
function fan(c){
  const w=640,h=240,pad={l:46,r:12,t:12,b:28}; const yrs=SIM.ret-USER.age; const N=yrs; const max=Math.max(c.hi,c.target)*1.05;
  const X=i=>pad.l+i/N*(w-pad.l-pad.r), Y=v=>pad.t+(1-v/max)*(h-pad.t-pad.b);
  const path=(r)=>{const m=Math.pow(1+r,1/12)-1; const pts=[];for(let i=0;i<=N;i++){const k=i*12;pts.push(8.4e5*Math.pow(1+m,k)+SIM.sip*((Math.pow(1+m,k)-1)/m));}return pts;};
  const L=path(.07),M=path(.10),H=path(.125);
  const line=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const band=`${line(H)} ${[...L].reverse().map((v,i)=>`L${X(N-i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ')} Z`;
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Projected retirement corpus at age ${SIM.ret}: median ${inrC(c.mid)}, range ${inrC(c.lo)} to ${inrC(c.hi)}, target ${inrC(c.target)}">
   ${ticks.map(t=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pad.l-8}" y="${Y(t)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" class="num">${t?inrC(t):'0'}</text>`).join('')}
   ${[0,.5,1].map(t=>`<text x="${X(t*N)}" y="${h-8}" text-anchor="${t?t===1?'end':'middle':'start'}" font-size="10.5" fill="var(--muted)">Age ${Math.round(USER.age+t*yrs)}</text>`).join('')}
   <path d="${band}" fill="var(--ai)" opacity=".16"/><path d="${line(M)}" fill="none" stroke="var(--ai)" stroke-width="2.5"/>
   <line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(c.target)}" y2="${Y(c.target)}" stroke="var(--warn-fill)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${w-pad.r}" y="${Y(c.target)-6}" text-anchor="end" font-size="11" fill="var(--warn)" font-weight="600">Goal ${inrC(c.target)}</text>
   <circle cx="${X(N)}" cy="${Y(M[N])}" r="5" fill="var(--surface)" stroke="var(--ai)" stroke-width="2.5"/></svg>`;
}

  <div class="stack sticky" style="gap:16px"><section class="frame" aria-label="Live preview"><div class="frame-bar"><i></i><i></i><i></i><span>app.${TENANT.slug}.example</span></div><div class="frame-body" id="wprev">${widget()}</div></section>
    <p class="small muted" style="text-align:center">Live preview. Toggle modules in Go-live setup, change colours in Branding.</p></div></div>`,
mount:v=>{
  $$('[data-snip]',v).forEach(b=>b.onclick=()=>{ snipKind=b.dataset.snip; route(); });
  $('#copy',v).onclick=()=>{ copyText(snippet(snipKind),'Snippet copied'); if(snipKind==='embed'&&!FLAGS.copied){ FLAGS.copied=true; } };
  $$('[data-copy]',v).forEach(b=>b.onclick=()=>copyText(b.dataset.copy,'Key copied'));
  $$('[data-con]',v).forEach(b=>b.onclick=()=>{ const c=CONNECTORS.find(x=>x.k===b.dataset.con); c.on=!c.on; toast(c.on?c.n+' connected. Customers will see a consent screen first.':c.n+' disconnected'); route(); });
  $('#reveal',v).onclick=()=>{ revealed=!revealed; route(); };
  $('#rotate',v).onclick=()=>toast('New secret key issued. The old key works for 24 more hours.');
  $('#wtest',v).onclick=()=>toast('Test event delivered. Your endpoint replied 200 in 142 ms.');
}};

/* ---- BRANDING ---- */
const BRAND_SW=['#0FB5A6','#2563EB','#7C3AED','#E11D48','#F59E0B','#16A34A','#0B1B2B'];
const ACC_SW=['#4F46E5','#0EA5E9','#DB2777','#F97316','#14B8A6','#8B5CF6'];
VIEWS.brand = {
html:()=>pageHead('Branding','Make it look like your product. Every screen, button and chart picks up your colours as you change them.',`<button class="btn" id="breset">Reset to defaults</button>`)+
  `<div class="grid g-int"><section class="card stack" style="gap:20px">
    <div class="field"><label for="bn">Brand name</label><input class="input" id="bn" maxlength="28" value="${esc(TENANT.name)}"></div>
    <div class="field"><span class="lbl">Primary colour</span><div class="sw-row" role="group" aria-label="Primary colour">${BRAND_SW.map(c=>`<button class="swatch" data-b="${c}" style="background:${c}" aria-label="Primary ${c}" aria-pressed="${c.toLowerCase()===TENANT.brand.toLowerCase()}"></button>`).join('')}<label class="swatch" style="background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);display:block;position:relative;overflow:hidden;cursor:pointer"><span class="sr">Custom primary colour</span><input type="color" id="bc" value="${TENANT.brand}" style="opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer"></label></div></div>
    <div class="field"><span class="lbl">Accent for AI features</span><div class="sw-row" role="group" aria-label="Accent colour">${ACC_SW.map(c=>`<button class="swatch" data-a="${c}" style="background:${c}" aria-label="Accent ${c}" aria-pressed="${c.toLowerCase()===TENANT.accent.toLowerCase()}"></button>`).join('')}</div></div>
    <div class="field"><div class="row between"><label for="br">Corner roundness</label><b class="num small" id="brv">${TENANT.radius}px</b></div><input type="range" id="br" min="8" max="32" step="2" value="${TENANT.radius}"></div>
    <div class="field"><span class="lbl">Typeface</span><div class="tabs" role="tablist" aria-label="Typeface">${Object.keys(FONTS).map(f=>`<button role="tab" data-f="${f}" aria-selected="${f===TENANT.font}">${f}</button>`).join('')}</div></div>
    <div class="kv" style="border:0;padding:0"><div><b class="small">Show “Powered by 5nance”</b><p class="tiny muted">Remove it on Enterprise</p></div><button class="sw" id="pw" role="switch" aria-checked="${TENANT.powered}" aria-label="Show powered by label"></button></div>
    <div class="item" style="background:var(--surface2)"><div class="ico i-ai">${ic('lock',18)}</div><div><b class="small">Custom domain and email sender</b><p class="small muted">Serve FinScore from <span class="mono">score.yourbank.com</span>. Available on Enterprise.</p></div></div></section>
  <div class="stack sticky" style="gap:16px"><section class="frame"><div class="frame-bar"><i></i><i></i><i></i><span>app.${TENANT.slug}.example</span></div><div class="frame-body" id="wprev">${widget()}</div></section>
    <div class="card flat"><span class="eyebrow">Buttons and states</span><div class="row wrap" style="margin-top:12px"><button class="btn primary sm">Primary</button><button class="btn ai sm">AI action</button><button class="btn sm">Secondary</button><span class="badge b-brand">Badge</span><span class="badge b-ai">AI</span></div></div>
    <p class="small muted" style="text-align:center">The whole workspace on the left updates too. Try the sidebar.</p></div></div>`,
mount:v=>{
  const set=(o)=>{ Object.assign(TENANT,o,{touched:true}); applyTenant(); };
  const refresh=()=>{ const w=$('#wprev',v); if(w) w.innerHTML=widget(); $$('[data-b]',v).forEach(b=>b.setAttribute('aria-pressed',b.dataset.b.toLowerCase()===TENANT.brand.toLowerCase())); $$('[data-a]',v).forEach(b=>b.setAttribute('aria-pressed',b.dataset.a.toLowerCase()===TENANT.accent.toLowerCase())); const r=$('.rail .brand'); if(r) r.innerHTML=`<div class="logo" style="font:700 13px var(--font-num)">${ini()}</div><div style="min-width:0"><div class="ellip">${esc(TENANT.name)}</div><div class="tiny muted" style="font:500 11px var(--font)">${TENANT.powered?'Powered by 5nance':'Workspace'}</div></div>`; };
  $('#bn',v).oninput=e=>{ TENANT.name=e.target.value.trim()||'Your brand'; TENANT.touched=true; refresh(); };
  $$('[data-b]',v).forEach(b=>b.onclick=()=>{ set({brand:b.dataset.b}); $('#bc',v).value=b.dataset.b; refresh(); });
  $('#bc',v).oninput=e=>{ set({brand:e.target.value}); refresh(); };
  $$('[data-a]',v).forEach(b=>b.onclick=()=>{ set({accent:b.dataset.a}); refresh(); });
  $('#br',v).oninput=e=>{ set({radius:+e.target.value}); $('#brv',v).textContent=e.target.value+'px'; };
  $$('[data-f]',v).forEach(b=>b.onclick=()=>{ set({font:b.dataset.f}); $$('[data-f]',v).forEach(x=>x.setAttribute('aria-selected',x===b)); refresh(); });
  $('#pw',v).onclick=e=>{ TENANT.powered=!TENANT.powered; e.currentTarget.setAttribute('aria-checked',TENANT.powered); refresh(); if(!TENANT.powered) toast('Preview only. Removing the label needs Enterprise.'); };
  $('#breset',v).onclick=()=>{ Object.assign(TENANT,{name:'Acme Wealth',brand:'#0FB5A6',accent:'#4F46E5',radius:24,font:'Inter',powered:true,touched:false}); applyTenant(); route(); toast('Branding reset'); };
}};

/* ---- TEAM ---- */
const ROLES=['Owner','Admin','Analyst','Viewer'];
const MEMBERS=[{n:'Deepak Sawant',e:'owner@acme-wealth.example',r:'Owner',s:'Active',l:'Now'},{n:'Priya Nair',e:'priya@acme-wealth.example',r:'Admin',s:'Active',l:'2 hours ago'},{n:'Rohan Kulkarni',e:'rohan@acme-wealth.example',r:'Analyst',s:'Active',l:'Yesterday'},{n:'Meera Iyer',e:'meera@acme-wealth.example',r:'Viewer',s:'Invited',l:'Not yet'}];
const PERMS=[['Manage billing & plan',1,1,0,0],['Edit branding & modules',1,1,0,0],['Create & rotate API keys',1,1,0,0],['View customer scores',1,1,1,1],['Export customer data',1,1,1,0],['Invite & remove people',1,1,0,0]];
VIEWS.team = {
html:()=>pageHead('Team & roles','Give each person the access they need. Every change is logged.',`<span class="badge b-brand num">${MEMBERS.length} of 5 seats</span>`)+
  `<div class="grid g-home"><section class="card"><div class="card-h"><h2>People</h2></div><div class="scroll-x"><table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th><span class="sr">Remove</span></th></tr></thead><tbody>
  ${MEMBERS.map((m,i)=>`<tr><td><div class="row"><div class="avatar" style="width:34px;height:34px;font-size:12px">${m.n.split(' ').map(w=>w[0]).join('')}</div><div><b class="small">${m.n}</b><p class="tiny muted">${m.e}</p></div></div></td><td>${m.r==='Owner'?'<span class="badge b-ai">Owner</span>':`<select class="input" style="min-height:36px;width:120px" data-role="${i}" aria-label="Role for ${m.n}">${ROLES.slice(1).map(r=>`<option ${r===m.r?'selected':''}>${r}</option>`).join('')}</select>`}</td><td><span class="badge ${m.s==='Active'?'b-pos':'b-warn'}">${m.s}</span></td><td class="small muted">${m.l}</td><td>${m.r==='Owner'?'':`<button class="btn sm ghost" data-rm="${i}" aria-label="Remove ${m.n}">${ic('x',14)}</button>`}</td></tr>`).join('')}</tbody></table></div>
  <hr class="hr"><form id="inv" class="row wrap" style="gap:10px;align-items:flex-end"><div class="field" style="flex:1;min-width:200px"><label for="ie">Invite by email</label><input class="input" id="ie" type="email" placeholder="name@company.com" required></div><div class="field"><label for="ir">Role</label><select class="input" id="ir">${ROLES.slice(1).map(r=>`<option>${r}</option>`).join('')}</select></div><button class="btn primary" type="submit">Send invite</button></form></section>
  <div class="stack" style="gap:16px"><section class="card"><div class="card-h"><h2>Single sign-on</h2><span class="badge b-ai">Enterprise</span></div><p class="small muted">Sign in with Okta, Azure AD or Google Workspace. Enforce MFA and auto-remove leavers.</p><button class="btn" id="sso" style="margin-top:12px">Talk to us about Enterprise</button></section>
  <section class="card"><div class="card-h"><h2>Recent activity</h2></div><div class="stack" style="gap:12px">${[['Priya Nair rotated the sandbox secret key','2 hours ago'],['Rohan Kulkarni exported 120 scores','Yesterday'],['You enabled the Coach module','3 days ago'],['Meera Iyer was invited as Viewer','3 days ago']].map(([a,t])=>`<div class="row" style="align-items:flex-start"><i class="led g" style="margin-top:7px"></i><div><p class="small">${a}</p><p class="tiny muted">${t}</p></div></div>`).join('')}</div></section></div></div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>What each role can do</h2></div><div class="scroll-x"><table class="tbl"><thead><tr><th>Permission</th>${ROLES.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([n,...a])=>`<tr><td>${n}</td>${a.map(x=>`<td>${x?`<span style="color:var(--pos)">${ic('check',16)}</span>`:'<span class="muted">–</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`,
mount:v=>{
  $$('[data-role]',v).forEach(s=>s.onchange=()=>{ MEMBERS[+s.dataset.role].r=s.value; toast(MEMBERS[+s.dataset.role].n+' is now '+s.value); });
  $$('[data-rm]',v).forEach(b=>b.onclick=()=>{ const m=MEMBERS.splice(+b.dataset.rm,1)[0]; toast(m.n+' removed'); route(); });
  $('#inv',v).onsubmit=e=>{ e.preventDefault(); if(MEMBERS.length>=5){ toast('All 5 seats are used. Upgrade for more.'); return; } const em=$('#ie',v).value.trim(); MEMBERS.push({n:em.split('@')[0].replace(/^./,c=>c.toUpperCase()),e:em,r:$('#ir',v).value,s:'Invited',l:'Not yet'}); toast('Invite sent to '+em); route(); };
  $('#sso',v).onclick=()=>toast('Thanks. Our team will reach out within one business day.');
}};

/* ---- BILLING ---- */
let annual=true;
VIEWS.billing = {
html:()=>{
  const P={Starter:0,Growth:annual?19999:24999,Enterprise:null};
  const tiers=[
    {n:'Starter',d:'Build and test in a sandbox.',p:'Free',f:['100 scores a month','Sandbox only','1 seat','Community support']},
    {n:'Growth',d:'Launch to your customers.',p:inr(P.Growth),f:['25,000 scores a month','Live environment and webhooks','Custom branding and 3 modules','5 seats, email support','Overage ₹0.80 per score'],cur:true},
    {n:'Enterprise',d:'Scale with controls and SLAs.',p:'Custom',f:['Volume pricing','Remove “Powered by”, custom domain','SSO, audit export, data residency','99.9% SLA and a named manager','Private rulebook configuration']}];
  const used=usageTotal(), over=Math.max(0,used-25000), sub=P.Growth+over*.8, gst=sub*.18;
  return pageHead('Plans & billing','Pay for scores generated. Switch plans any time and we prorate the difference.',`<div class="tabs" role="tablist" aria-label="Billing period"><button role="tab" data-per="m" aria-selected="${!annual}">Monthly</button><button role="tab" data-per="a" aria-selected="${annual}">Yearly · save 20%</button></div>`)+
  `<div class="grid g-3">${tiers.map(t=>`<section class="card tier ${t.cur?'cur':''}">${t.cur?'<span class="badge b-brand" style="position:absolute;top:16px;right:16px">Current plan</span>':''}<div><h2>${t.n}</h2><p class="small muted">${t.d}</p></div><div><span class="price num">${t.p}</span>${t.p.startsWith('₹')?'<span class="muted small"> / month</span>':''}${t.p.startsWith('₹')&&annual?'<p class="tiny muted" style="margin-top:6px">Billed yearly, '+inr(P.Growth*12)+'</p>':''}</div><ul>${t.f.map(x=>`<li>${ic('check',16)}<span>${x}</span></li>`).join('')}</ul><button class="btn ${t.cur?'':t.n==='Enterprise'?'':'sm'}" data-plan="${t.n}" ${t.cur?'disabled':''} style="margin-top:auto">${t.cur?'You are on Growth':t.n==='Enterprise'?'Contact sales':'Switch to Starter'}</button></section>`).join('')}</div>
  <div class="grid g-home" style="margin-top:16px"><section class="card"><div class="card-h"><h2>This month's usage</h2><span class="small muted">Resets 1 December</span></div>
    ${[['Scores generated',used,25000],['Seats',MEMBERS.length,5],['Domains for embed',2,3]].map(([n,u,l])=>`<div style="margin-bottom:16px"><div class="row between small"><span>${n}</span><b class="num">${u.toLocaleString('en-IN')} <span class="muted" style="font-weight:500">of ${l.toLocaleString('en-IN')}</span></b></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,u/l*100)}%;background:${u/l>.9?'var(--warn-fill)':'linear-gradient(90deg,var(--brand),#7AE7DC)'}"></i></div></div>`).join('')}
    <hr class="hr"><div class="row between"><span>Estimated next invoice</span><b class="num" style="font-size:20px">${inr(sub+gst)}</b></div><p class="tiny muted" style="margin-top:4px">${inr(sub)} plan and usage + ${inr(gst)} GST (18%)</p></section>
  <section class="card"><div class="card-h"><h2>Invoices</h2><button class="btn sm ghost" id="pm">${ic('card',14)} Payment method</button></div>
    ${[['Nov 2026',P.Growth],['Oct 2026',P.Growth],['Sep 2026',P.Growth]].map(([m,a])=>`<div class="kv"><div><b class="small">${m}</b><p class="tiny muted">${inr(a*1.18)} incl. GST</p></div><div class="row"><span class="badge b-pos">Paid</span><button class="btn sm" data-inv="${m}">PDF</button></div></div>`).join('')}</section></div>`;},
mount:v=>{
  $$('[data-per]',v).forEach(b=>b.onclick=()=>{ annual=b.dataset.per==='a'; route(); });
  $$('[data-plan]',v).forEach(b=>b.onclick=()=>toast(b.dataset.plan==='Enterprise'?'Thanks. Sales will contact you within one business day.':'Downgrade scheduled for the end of this billing period.'));
  $$('[data-inv]',v).forEach(b=>b.onclick=()=>toast('Invoice for '+b.dataset.inv+' is being prepared'));
  $('#pm',v).onclick=()=>toast('Payments are handled on our secure billing page.');
}};

route();
</script>

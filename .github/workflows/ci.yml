name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy app
      - run: lint-imports
      - run: pytest -q
      - name: OpenAPI schema is up to date
        run: |
          python ../scripts/export_openapi.py /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json
      - run: pip install pip-audit && pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "POSTGRES_PASSWORD=ci-pass" > .env
          echo "JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret" >> .env
          echo "DATA_ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> .env
          docker compose up -d --build --wait db backend frontend mailpit
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run e2e
      - if: failure()
        run: docker compose logs
